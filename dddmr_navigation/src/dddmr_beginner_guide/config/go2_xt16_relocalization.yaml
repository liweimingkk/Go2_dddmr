mcl_3dl:
  ros__parameters:
    # Never search globally at startup or directly on LOST. This flag only
    # permits escalation after a bounded local recovery has failed.
    auto_global_localization: true
    global_localization_grid: 0.25
    global_localization_div_yaw: 36
    global_localization_max_candidates: 4096
    global_localization_top_candidates: 8
    global_localization_num_particles: 240
    global_localization_max_observation_points: 256
    global_localization_max_surface_points: 256
    global_localization_min_match_ratio: 0.08
    global_localization_max_residual: 0.22
    global_localization_surface_match_distance: 0.30
    global_localization_min_surface_match_ratio: 0.35
    global_localization_min_surface_match_margin: 0.08
    global_localization_surface_candidate_max_drop: 0.08
    # A global candidate must remain compatible with odometry propagated from
    # the last trusted pose and win over the second distinct basin.
    global_localization_max_odom_xy_error: 2.0
    global_localization_max_odom_yaw_error: 0.70
    # Do not seed particles until the same basin wins on three distinct
    # synchronized feature frames.
    global_localization_confirmation_frames: 3
    global_localization_confirmation_max_xy: 0.75
    global_localization_confirmation_max_yaw: 0.35
    global_localization_retry_sec: 2.0

    # Flat-floor Go2 localization is 2.5D: MCL estimates x/y/yaw only.
    # roll/pitch comes from odometry/IMU gravity and z is local map ground plus
    # the measured base_link clearance (live flat features are about 0.33 m).
    flat_ground.enabled: true
    flat_ground.base_link_height: 0.32
    flat_ground.ground_search_radius: 0.80
    flat_ground.min_points: 4
    flat_ground.observation_height_tolerance: 0.25
    flat_ground.observation_plane_distance: 0.06
    flat_ground.observation_max_tilt: 0.35

    # Gaussian refinement around each accepted coarse candidate.
    global_localization_seed_std_x: 0.35
    global_localization_seed_std_y: 0.35
    global_localization_seed_std_z: 0.0
    global_localization_seed_std_roll: 0.0
    global_localization_seed_std_pitch: 0.0
    global_localization_seed_std_yaw: 0.12

    # LOST first retries around the odometry-continuous last trusted pose.
    # The command gate remains stopped throughout LOCALIZING.
    local_recovery_std_x: 0.60
    local_recovery_std_y: 0.60
    local_recovery_std_z: 0.0
    local_recovery_std_roll: 0.0
    local_recovery_std_pitch: 0.0
    local_recovery_std_yaw: 0.35
    local_recovery_timeout_sec: 8.0

    # Do not re-introduce the dimensions removed by the 2.5D constraint.
    resample_var_z: 0.0
    resample_var_roll: 0.0
    resample_var_pitch: 0.0
    expansion_var_z: 0.0
    expansion_var_roll: 0.0
    expansion_var_pitch: 0.0

    # TRACKING requires several consecutive, converged observations. LOST uses
    # lower quality thresholds to provide hysteresis and avoid state flapping.
    localization_tracking_match_ratio: 0.15
    localization_lost_match_ratio: 0.08
    # In 2.5D, particle spread is resolved along the local map-ground tangent
    # plane and normal. On horizontal ground these remain exactly world XY/Z;
    # on ramps, expected elevation change is retained in tangent uncertainty
    # instead of being misclassified as off-ground Z uncertainty.
    # Residual is likewise decoupled from coverage only on a confirmed slope:
    # match_ratio retains the coverage gate while residual measures the points
    # that actually matched. Flat ground keeps the legacy metrics unchanged.
    localization_slope_compensation_enabled: true
    localization_slope_min_tilt: 0.05
    # A live goal is not eligible for motion until this process has received
    # either a manual /initial_3d_pose or an explicit operator-confirmed global
    # localization request. A configured zero seed is only a visualization
    # fallback and must not unlock the command gate.
    localization_require_operator_initialization: true
    localization_tracking_max_xy_std: 0.75
    # Keep the strict flat-ground vertical spread threshold. The 2026-08-04
    # ramp run measured 0.080..0.099 m along the confirmed surface normal while
    # match, residual, normal, and height checks remained healthy, so admit
    # that band only when slope compensation is active.
    localization_tracking_max_z_std: 0.08
    localization_tracking_max_slope_normal_std: 0.12
    localization_tracking_max_roll_std: 0.035
    localization_tracking_max_pitch_std: 0.035
    localization_tracking_max_yaw_std: 0.35
    # Repeated Orin dry-runs at the current static pose converged tightly with
    # healthy match ratio, spread, tilt, and height at residual=0.202..0.207.
    # Admit that measured band while retaining a 0.03 margin below LOST.
    localization_tracking_max_residual: 0.22
    localization_tracking_max_map_odom_tilt: 0.035
    # XT16 ground-normal noise reached 0.118 rad with otherwise healthy
    # geometry. Preserve a fail-closed gap to the 0.175 rad LOST threshold.
    localization_tracking_max_ground_normal_error: 0.14
    localization_tracking_max_base_height_error: 0.06
    localization_tracking_max_pose_height_error: 0.04
    localization_lost_max_xy_std: 1.50
    localization_lost_max_z_std: 0.15
    localization_lost_max_slope_normal_std: 0.15
    localization_lost_max_roll_std: 0.08
    localization_lost_max_pitch_std: 0.08
    localization_lost_max_yaw_std: 0.80
    localization_lost_max_residual: 0.25
    localization_lost_max_map_odom_tilt: 0.087
    localization_lost_max_ground_normal_error: 0.175
    localization_lost_max_base_height_error: 0.12
    localization_lost_max_pose_height_error: 0.10
    localization_require_ground_health: true
    localization_tracking_good_frames: 5
    localization_lost_bad_frames: 3
    localization_measure_interval_sec: 0.50
    # Timeout is a stop/LOST threshold only. It never triggers an immediate
    # global jump; per-topic receive/sync/processing metrics expose the cause.
    localization_sensor_timeout_sec: 2.0
    localization_timeout_sec: 30.0

go2_nav_cmd_gate:
  ros__parameters:
    require_localization_tracking: true
    localization_status_topic: "/localization_status"
    localization_status_timeout_sec: 0.75
    require_localization_health: true
    localization_health_topic: "/localization_health"
    localization_health_timeout_sec: 0.75
    # TF is deliberately re-published at current time between MCL corrections.
    # Independently require pose output so a stalled particle filter cannot
    # keep motion enabled behind a fresh-looking map->odom transform.
    require_localization_pose: true
    localization_pose_topic: "/mcl_pose"
    localization_pose_timeout_sec: 1.25
    # weighted_ground is published only after the global static graph and
    # weights are complete. Motion remains blocked before that latched sample.
    require_static_layer_ready: true
    static_layer_topic: "/weighted_ground"
